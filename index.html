<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생 파일 검색</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md relative">
        <button onclick="checkAdminPassword()" class="absolute top-4 right-4 text-xs text-gray-400 hover:text-gray-600">관리자</button>
        
        <h1 class="text-2xl font-bold mb-6 text-center text-blue-600">내 파일 찾기</h1>
        
        <div class="mb-4">
            <label for="studentId" class="block text-gray-700 font-semibold mb-2">학번 입력</label>
            <input type="text" id="studentId" placeholder="예: 3514" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        
        <button onclick="searchFiles()" class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-200">
            검색하기
        </button>

        <div id="results" class="mt-6 hidden">
            <h2 class="text-lg font-semibold text-gray-800 mb-3">검색 결과</h2>
            <ul id="fileList" class="space-y-2">
                <!-- 결과가 여기에 표시됩니다 -->
            </ul>
        </div>
        <div id="noResults" class="mt-6 hidden text-center text-red-500">
            해당 학번으로 등록된 파일이 없습니다.
        </div>
    </div>

    <script>
        let mappingData = [];

        function checkAdminPassword() {
            const pwd = prompt("관리자 비밀번호를 입력하세요:");
            if (pwd === "admin") {
                window.location.href = "admin.html";
            } else if (pwd !== null) {
                alert("비밀번호가 틀렸습니다.");
            }
        }

        window.onload = async () => {
            try {
                // 브라우저 캐시 방지를 위해 쿼리 파라미터 추가
                const response = await fetch(`mapping.json?t=${new Date().getTime()}`);
                if (response.ok) {
                    mappingData = await response.json();
                } else {
                    console.error("mapping.json 불러오기 실패");
                }
            } catch (e) {
                console.error("데이터 로딩 중 오류 발생:", e);
            }
        };

        function searchFiles() {
            const studentId = document.getElementById('studentId').value.trim();
            const resultsDiv = document.getElementById('results');
            const fileList = document.getElementById('fileList');
            const noResultsDiv = document.getElementById('noResults');

            if (!studentId) {
                alert("학번을 입력해주세요.");
                return;
            }

            const matchedFiles = mappingData.filter(item => item.studentId === studentId);

            fileList.innerHTML = ''; 

            if (matchedFiles.length > 0) {
                matchedFiles.forEach(item => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = encodeURI(item.filename);
                    a.textContent = item.originalName || item.filename;
                    a.className = "block bg-gray-50 border border-gray-200 rounded p-3 text-blue-600 hover:bg-blue-50 hover:underline transition shadow-sm";
                    a.target = "_blank"; 
                    
                    li.appendChild(a);
                    fileList.appendChild(li);
                });
                resultsDiv.classList.remove('hidden');
                noResultsDiv.classList.add('hidden');
            } else {
                resultsDiv.classList.add('hidden');
                noResultsDiv.classList.remove('hidden');
            }
        }
        
        document.getElementById('studentId').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchFiles();
            }
        });
    </script>
</body>
</html>
