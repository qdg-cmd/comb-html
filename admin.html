<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지 - 파일 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">

    <div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-md relative mb-8">
        <a href="index.html" class="absolute top-4 right-4 text-sm text-blue-500 hover:underline">학생 페이지로 이동</a>

        <h1 class="text-2xl font-bold mb-6 text-gray-800">관리자 페이지 (파일 업로드 및 관리)</h1>
        
        <!-- 설정 섹션 -->
        <div class="mb-8 p-4 bg-gray-50 rounded-lg border border-gray-200">
            <h2 class="text-lg font-semibold mb-3">관리자 보안 설정</h2>
            <div class="grid grid-cols-2 gap-4 mb-3">
                <div>
                    <label class="block text-sm font-medium text-gray-700">GitHub 사용자명 (자동감지)</label>
                    <input type="text" id="ghOwner" class="mt-1 w-full px-3 py-2 border rounded-md bg-gray-100" readonly>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">저장소 이름 (자동감지)</label>
                    <input type="text" id="ghRepo" class="mt-1 w-full px-3 py-2 border rounded-md bg-gray-100" readonly>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 text-blue-600 font-bold">Personal Access Token (필수)</label>
                <input type="password" id="ghToken" class="mt-1 w-full px-3 py-2 border rounded-md border-blue-400" placeholder="ghp_XXXXXXXXXXXXXXXXXXXX">
            </div>
            <p class="text-xs text-gray-500 mt-2">보안을 위해 토큰은 서버에 저장되지 않으며, 새로운 기기에서 접속할 때마다 한 번씩 입력해야 합니다.</p>
            <button onclick="saveSettings()" class="mt-3 text-sm bg-gray-600 text-white px-3 py-1 rounded hover:bg-gray-700">토큰 내 기기에 저장하기</button>
        </div>

        <!-- 파일 업로드 섹션 -->
        <div class="mb-8 p-4 bg-blue-50 rounded-lg border border-blue-100">
            <h2 class="text-lg font-semibold mb-3 text-blue-800">1. 새 파일 업로드</h2>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700">공통 학번 지정 (선택한 파일 전체에 적용)</label>
                <input type="text" id="studentIdInput" class="mt-1 w-full px-3 py-2 border rounded-md" placeholder="예: 3514">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700">HTML 파일 선택 (여러 개 선택 가능)</label>
                <input type="file" id="fileInput" accept=".html" multiple class="mt-1 w-full bg-white">
            </div>
            
            <button id="uploadBtn" onclick="uploadFile()" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 disabled:bg-blue-300">
                업로드 및 분류하기
            </button>
        </div>

        <!-- 파일 순서 변경 및 삭제 섹션 -->
        <div class="mb-6 p-4 bg-yellow-50 rounded-lg border border-yellow-100">
            <h2 class="text-lg font-semibold mb-3 text-yellow-800">2. 학생별 파일 관리 (순서 변경 및 매핑 삭제)</h2>
            <div class="flex gap-2 mb-4">
                <input type="text" id="manageStudentId" class="flex-1 px-3 py-2 border rounded-md" placeholder="학번 검색 (예: 3514)">
                <button onclick="loadStudentFiles()" class="bg-yellow-600 text-white px-4 py-2 rounded-md hover:bg-yellow-700 font-semibold">검색</button>
            </div>
            
            <div id="manageArea" class="hidden">
                <ul id="manageFileList" class="space-y-2 mb-4">
                    <!-- JS로 리스트 생성 -->
                </ul>
                <button id="saveOrderBtn" onclick="saveUpdatedMapping()" class="w-full bg-green-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-green-700">
                    변경된 순서 및 삭제 내역 저장하기 (GitHub 반영)
                </button>
            </div>
        </div>

        <!-- 로그 표시 -->
        <div id="logArea" class="mt-4 p-3 bg-gray-900 text-green-400 text-sm font-mono rounded h-40 overflow-y-auto hidden">
        </div>

    </div>

    <script>
        let globalMappingData = [];
        let globalSha = null;
        let currentManageFiles = [];

        window.onload = () => {
            const hostname = window.location.hostname;
            const pathname = window.location.pathname;
            
            let autoOwner = "";
            let autoRepo = "";

            if (hostname.includes('.github.io')) {
                autoOwner = hostname.split('.')[0];
                autoRepo = pathname.split('/')[1];
            }

            document.getElementById('ghOwner').value = autoOwner;
            document.getElementById('ghRepo').value = autoRepo;
            document.getElementById('ghToken').value = localStorage.getItem('ghToken') || '';
        };

        function saveSettings() {
            localStorage.setItem('ghToken', document.getElementById('ghToken').value.trim());
            alert('토큰이 현재 기기에 저장되었습니다.');
        }

        function logMessage(msg) {
            const logArea = document.getElementById('logArea');
            logArea.classList.remove('hidden');
            logArea.innerHTML += `<div>> ${msg}</div>`;
            logArea.scrollTop = logArea.scrollHeight;
        }

        function utf8_to_b64(str) {
            return window.btoa(unescape(encodeURIComponent(str)));
        }

        function cleanInput(val) {
            // 빈칸 및 특수문자 제거 (주소에 들어가면 에러 유발)
            return val.trim().replace(/\s+/g, '');
        }

        async function getMappingJson(owner, repo, token) {
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/mapping.json?t=${new Date().getTime()}`;
            const res = await fetch(url, {
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Cache-Control': 'no-cache'
                }
            });
            if (res.status === 404) {
                return { content: [], sha: null };
            }
            if (res.status === 401) {
                throw new Error("토큰(Token)이 올바르지 않거나 권한(repo)이 없습니다.");
            }
            if (!res.ok) throw new Error(`mapping.json 가져오기 실패 (코드: ${res.status})`);
            
            const data = await res.json();
            try {
                const decodedStr = decodeURIComponent(escape(window.atob(data.content)));
                const content = JSON.parse(decodedStr);
                return { content: Array.isArray(content) ? content : [], sha: data.sha };
            } catch (e) {
                console.warn("mapping.json 파싱 실패, 빈 배열로 덮어씁니다.", e);
                return { content: [], sha: data.sha };
            }
        }

        async function updateMappingJson(owner, repo, token, mappingData, sha) {
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/mapping.json`;
            const jsonStr = JSON.stringify(mappingData, null, 2);
            const body = {
                message: "Update mapping.json via Admin",
                content: utf8_to_b64(jsonStr)
            };
            if (sha) body.sha = sha;

            const res = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });
            if (!res.ok) throw new Error(`mapping.json 업데이트 실패 (코드: ${res.status})`);
            const resData = await res.json();
            return resData.content.sha;
        }

        async function uploadHtmlFileToGithub(owner, repo, token, fileObj) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    try {
                        const content = e.target.result.split(',')[1];
                        const safeFileName = `${Date.now()}_${fileObj.name.replace(/[^a-zA-Z0-9.\-_가-힣()]/g, '')}`;
                        
                        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${safeFileName}`;
                        const body = {
                            message: `Upload ${fileObj.name}`,
                            content: content
                        };

                        const res = await fetch(url, {
                            method: 'PUT',
                            headers: {
                                'Authorization': `token ${token}`,
                                'Accept': 'application/vnd.github.v3+json',
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(body)
                        });

                        if (!res.ok) throw new Error(`${fileObj.name} 업로드 실패 (코드: ${res.status})`);
                        resolve(safeFileName);
                    } catch (error) {
                        reject(error);
                    }
                };
                reader.onerror = () => reject(new Error("파일 읽기 오류"));
                reader.readAsDataURL(fileObj);
            });
        }

        function handleError(error) {
            console.error(error);
            let msg = error.message;
            if (msg.includes('Failed to fetch')) {
                msg = "네트워크 오류입니다. 다음을 확인하세요: 1) GitHub 아이디/저장소 이름에 띄어쓰기가 없는지 2) 인터넷 연결 상태 3) 광고 차단기(Adblock) 비활성화";
            }
            logMessage(`❌ 오류 발생: ${msg}`);
            alert(`오류 발생: ${msg}`);
        }

        async function uploadFile() {
            const owner = cleanInput(document.getElementById('ghOwner').value);
            const repo = cleanInput(document.getElementById('ghRepo').value);
            const token = document.getElementById('ghToken').value.trim();
            const studentId = document.getElementById('studentIdInput').value.trim();
            const fileInput = document.getElementById('fileInput');
            const uploadBtn = document.getElementById('uploadBtn');

            if (!owner || !repo || !token) { alert("GitHub 아이디, 저장소 이름, 토큰을 모두 확인해주세요."); return; }
            if (!studentId) { alert("학번을 입력해주세요."); return; }
            if (fileInput.files.length === 0) { alert("업로드할 HTML 파일을 하나 이상 선택해주세요."); return; }

            uploadBtn.disabled = true;
            uploadBtn.innerText = "처리 중...";
            document.getElementById('logArea').innerHTML = '';

            try {
                logMessage(`기존 mapping.json 불러오는 중...`);
                const mappingInfo = await getMappingJson(owner, repo, token);
                globalMappingData = mappingInfo.content;
                globalSha = mappingInfo.sha;

                const files = fileInput.files;
                
                for (let i = 0; i < files.length; i++) {
                    const fileObj = files[i];
                    logMessage(`[${i+1}/${files.length}] ${fileObj.name} 업로드 중...`);
                    const uploadedFileName = await uploadHtmlFileToGithub(owner, repo, token, fileObj);
                    
                    globalMappingData.push({
                        studentId: studentId,
                        filename: uploadedFileName,
                        originalName: fileObj.name,
                        uploadTime: new Date().toISOString()
                    });
                }

                logMessage(`mapping.json 업데이트 중...`);
                globalSha = await updateMappingJson(owner, repo, token, globalMappingData, globalSha);
                
                logMessage(`✅ 모든 업로드 완료!`);
                alert(`${files.length}개의 파일 업로드 및 매핑이 완료되었습니다.`);
                
                fileInput.value = ''; 
                document.getElementById('studentIdInput').value = '';

            } catch (error) {
                handleError(error);
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.innerText = "업로드 및 분류하기";
            }
        }

        // --- 순서 변경 및 삭제 기능 ---

        async function loadStudentFiles() {
            const owner = cleanInput(document.getElementById('ghOwner').value);
            const repo = cleanInput(document.getElementById('ghRepo').value);
            const token = document.getElementById('ghToken').value.trim();
            const studentId = document.getElementById('manageStudentId').value.trim();

            if (!owner || !repo || !token) { alert("GitHub 아이디, 저장소 이름, 토큰을 모두 확인해주세요."); return; }
            if (!studentId) { alert("검색할 학번을 입력해주세요."); return; }

            document.getElementById('logArea').innerHTML = '';
            logMessage(`데이터를 불러오는 중입니다...`);

            try {
                const mappingInfo = await getMappingJson(owner, repo, token);
                globalMappingData = mappingInfo.content;
                globalSha = mappingInfo.sha;

                currentManageFiles = globalMappingData.filter(item => item.studentId === studentId);
                
                if (currentManageFiles.length === 0) {
                    alert("해당 학번으로 등록된 파일이 없습니다.");
                    document.getElementById('manageArea').classList.add('hidden');
                    return;
                }

                renderManageList();
                document.getElementById('manageArea').classList.remove('hidden');
                logMessage(`✅ ${studentId} 학번의 파일 ${currentManageFiles.length}개를 불러왔습니다.`);
            } catch (error) {
                handleError(error);
            }
        }

        function renderManageList() {
            const listEl = document.getElementById('manageFileList');
            listEl.innerHTML = '';

            currentManageFiles.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = "flex items-center justify-between bg-white p-3 border border-gray-200 rounded shadow-sm";
                
                const nameDiv = document.createElement('div');
                nameDiv.className = "font-medium text-gray-800 truncate flex-1";
                nameDiv.textContent = item.originalName || item.filename;

                const btnDiv = document.createElement('div');
                btnDiv.className = "flex gap-2 ml-4";

                const upBtn = document.createElement('button');
                upBtn.textContent = "▲ 위로";
                upBtn.className = "px-2 py-1 bg-gray-200 hover:bg-gray-300 rounded text-xs font-bold disabled:opacity-50";
                upBtn.disabled = (index === 0);
                upBtn.onclick = () => moveItem(index, -1);

                const downBtn = document.createElement('button');
                downBtn.textContent = "▼ 아래로";
                downBtn.className = "px-2 py-1 bg-gray-200 hover:bg-gray-300 rounded text-xs font-bold disabled:opacity-50";
                downBtn.disabled = (index === currentManageFiles.length - 1);
                downBtn.onclick = () => moveItem(index, 1);

                const delBtn = document.createElement('button');
                delBtn.textContent = "✖ 매핑 삭제";
                delBtn.className = "px-2 py-1 bg-red-100 text-red-600 hover:bg-red-200 rounded text-xs font-bold";
                delBtn.onclick = () => deleteItem(index);

                btnDiv.appendChild(upBtn);
                btnDiv.appendChild(downBtn);
                btnDiv.appendChild(delBtn);

                li.appendChild(nameDiv);
                li.appendChild(btnDiv);
                listEl.appendChild(li);
            });
        }

        function moveItem(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= currentManageFiles.length) return;
            
            const temp = currentManageFiles[index];
            currentManageFiles[index] = currentManageFiles[newIndex];
            currentManageFiles[newIndex] = temp;
            
            renderManageList();
        }

        function deleteItem(index) {
            if (confirm("학생 목록에서 이 파일을 정말 빼시겠습니까?\n(실제 서버의 HTML 파일은 보존됩니다.)")) {
                currentManageFiles.splice(index, 1);
                renderManageList();
            }
        }

        async function saveUpdatedMapping() {
            const owner = cleanInput(document.getElementById('ghOwner').value);
            const repo = cleanInput(document.getElementById('ghRepo').value);
            const token = document.getElementById('ghToken').value.trim();
            const studentId = document.getElementById('manageStudentId').value.trim();
            const btn = document.getElementById('saveOrderBtn');

            btn.disabled = true;
            btn.innerText = "저장 중...";
            
            try {
                const otherFiles = globalMappingData.filter(item => item.studentId !== studentId);
                globalMappingData = [...otherFiles, ...currentManageFiles];

                logMessage(`순서 변경 및 삭제 내역 GitHub 업데이트 중...`);
                globalSha = await updateMappingJson(owner, repo, token, globalMappingData, globalSha);
                
                logMessage(`✅ 성공적으로 변경사항이 저장되었습니다!`);
                alert("변경사항이 성공적으로 저장되었습니다!");
                
            } catch (error) {
                handleError(error);
            } finally {
                btn.disabled = false;
                btn.innerText = "변경된 순서 및 삭제 내역 저장하기 (GitHub 반영)";
            }
        }
    </script>
</body>
</html>
