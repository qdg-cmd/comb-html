<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지 - 파일 업로드</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">

    <div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-md relative">
        <a href="index.html" class="absolute top-4 right-4 text-sm text-blue-500 hover:underline">학생 페이지로 이동</a>

        <h1 class="text-2xl font-bold mb-6 text-gray-800">관리자 페이지 (GitHub 자동 업로드)</h1>
        
        <!-- 설정 섹션 -->
        <div class="mb-8 p-4 bg-gray-50 rounded-lg border">
            <h2 class="text-lg font-semibold mb-3">GitHub 설정</h2>
            <div class="grid grid-cols-2 gap-4 mb-3">
                <div>
                    <label class="block text-sm font-medium text-gray-700">GitHub 사용자명 (Owner)</label>
                    <input type="text" id="ghOwner" class="mt-1 w-full px-3 py-2 border rounded-md" placeholder="예: myusername">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">저장소 이름 (Repo)</label>
                    <input type="text" id="ghRepo" class="mt-1 w-full px-3 py-2 border rounded-md" placeholder="예: comb-html">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Personal Access Token</label>
                <input type="password" id="ghToken" class="mt-1 w-full px-3 py-2 border rounded-md" placeholder="ghp_XXXXXXXXXXXXXXXXXXXX">
            </div>
            <p class="text-xs text-gray-500 mt-2">이 정보는 브라우저에만 저장되며 외부로 전송되지 않습니다.</p>
            <button onclick="saveSettings()" class="mt-3 text-sm bg-gray-600 text-white px-3 py-1 rounded hover:bg-gray-700">설정 저장하기</button>
        </div>

        <!-- 파일 업로드 섹션 -->
        <div class="mb-6">
            <h2 class="text-lg font-semibold mb-3">파일 업로드 및 학번 지정</h2>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700">학번</label>
                <input type="text" id="studentIdInput" class="mt-1 w-full px-3 py-2 border rounded-md" placeholder="예: 3514">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700">HTML 파일 선택</label>
                <input type="file" id="fileInput" accept=".html" class="mt-1 w-full">
            </div>
            
            <button id="uploadBtn" onclick="uploadFile()" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 disabled:bg-blue-300">
                업로드 및 분류하기
            </button>
        </div>

        <!-- 로그 표시 -->
        <div id="logArea" class="mt-4 p-3 bg-gray-900 text-green-400 text-sm font-mono rounded h-32 overflow-y-auto hidden">
        </div>

    </div>

    <script>
        // 초기 설정 불러오기
        window.onload = () => {
            document.getElementById('ghOwner').value = localStorage.getItem('ghOwner') || '';
            document.getElementById('ghRepo').value = localStorage.getItem('ghRepo') || '';
            document.getElementById('ghToken').value = localStorage.getItem('ghToken') || '';
        };

        function saveSettings() {
            localStorage.setItem('ghOwner', document.getElementById('ghOwner').value.trim());
            localStorage.setItem('ghRepo', document.getElementById('ghRepo').value.trim());
            localStorage.setItem('ghToken', document.getElementById('ghToken').value.trim());
            alert('설정이 브라우저에 저장되었습니다.');
        }

        function logMessage(msg) {
            const logArea = document.getElementById('logArea');
            logArea.classList.remove('hidden');
            logArea.innerHTML += `<div>> ${msg}</div>`;
            logArea.scrollTop = logArea.scrollHeight;
        }

        // 텍스트를 Base64로 인코딩 (유니코드 대응)
        function utf8_to_b64(str) {
            return window.btoa(unescape(encodeURIComponent(str)));
        }

        async function getMappingJson(owner, repo, token) {
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/mapping.json`;
            const res = await fetch(url, {
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });
            if (res.status === 404) {
                return { content: [], sha: null };
            }
            if (!res.ok) throw new Error("mapping.json 가져오기 실패");
            
            const data = await res.json();
            // Base64 디코딩 후 JSON 파싱
            const content = JSON.parse(decodeURIComponent(escape(window.atob(data.content))));
            return { content, sha: data.sha };
        }

        async function updateMappingJson(owner, repo, token, mappingData, sha) {
            const url = `https://api.github.com/repos/${owner}/${repo}/contents/mapping.json`;
            const jsonStr = JSON.stringify(mappingData, null, 2);
            const body = {
                message: "Update mapping.json via Admin",
                content: utf8_to_b64(jsonStr)
            };
            if (sha) body.sha = sha;

            const res = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });
            if (!res.ok) throw new Error("mapping.json 업데이트 실패");
        }

        async function uploadHtmlFileToGithub(owner, repo, token, fileObj) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    try {
                        const content = e.target.result.split(',')[1]; // base64 내용만 추출
                        // 파일 이름 URL 인코딩 이슈 방지를 위해 타임스탬프 등 고유 파일명 생성 권장
                        const safeFileName = `${Date.now()}_${fileObj.name.replace(/[^a-zA-Z0-9.\-_]/g, '')}`;
                        
                        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${safeFileName}`;
                        const body = {
                            message: `Upload ${fileObj.name}`,
                            content: content
                        };

                        const res = await fetch(url, {
                            method: 'PUT',
                            headers: {
                                'Authorization': `token ${token}`,
                                'Accept': 'application/vnd.github.v3+json',
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(body)
                        });

                        if (!res.ok) throw new Error("HTML 파일 업로드 실패");
                        resolve(safeFileName);
                    } catch (error) {
                        reject(error);
                    }
                };
                reader.readAsDataURL(fileObj); // Base64로 바로 읽기
            });
        }

        async function uploadFile() {
            const owner = document.getElementById('ghOwner').value.trim();
            const repo = document.getElementById('ghRepo').value.trim();
            const token = document.getElementById('ghToken').value.trim();
            const studentId = document.getElementById('studentIdInput').value.trim();
            const fileInput = document.getElementById('fileInput');
            const uploadBtn = document.getElementById('uploadBtn');

            if (!owner || !repo || !token) {
                alert("GitHub 설정(Owner, Repo, Token)을 모두 입력해주세요."); return;
            }
            if (!studentId) {
                alert("학번을 입력해주세요."); return;
            }
            if (fileInput.files.length === 0) {
                alert("업로드할 HTML 파일을 선택해주세요."); return;
            }

            const fileObj = fileInput.files[0];
            uploadBtn.disabled = true;
            uploadBtn.innerText = "처리 중...";
            document.getElementById('logArea').innerHTML = '';

            try {
                // 1. HTML 파일 업로드
                logMessage(`${fileObj.name} 파일을 GitHub에 업로드 중...`);
                const uploadedFileName = await uploadHtmlFileToGithub(owner, repo, token, fileObj);
                logMessage(`HTML 파일 업로드 성공! (저장된 이름: ${uploadedFileName})`);

                // 2. mapping.json 가져오기
                logMessage(`기존 mapping.json 불러오는 중...`);
                const mappingInfo = await getMappingJson(owner, repo, token);
                let mappingData = mappingInfo.content;
                logMessage(`기존 매핑 데이터 로드 완료 (${mappingData.length}건)`);

                // 3. 새로운 매핑 정보 추가
                mappingData.push({
                    studentId: studentId,
                    filename: uploadedFileName,
                    originalName: fileObj.name,
                    uploadTime: new Date().toISOString()
                });

                // 4. mapping.json 업데이트
                logMessage(`mapping.json 업데이트(커밋) 중...`);
                await updateMappingJson(owner, repo, token, mappingData, mappingInfo.sha);
                logMessage(`✅ 모든 작업 완료! 이제 학생 페이지에서 검색 가능합니다.`);
                
                alert("업로드 및 매핑이 완료되었습니다.");
                fileInput.value = ''; // 폼 초기화

            } catch (error) {
                console.error(error);
                logMessage(`❌ 오류 발생: ${error.message}`);
                alert(`오류 발생: ${error.message}`);
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.innerText = "업로드 및 분류하기";
            }
        }
    </script>
</body>
</html>
