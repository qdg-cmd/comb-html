                text: "평소 밝고 긍정적인 에너지로 수업에 임하며, 사회 현상을 자신만의 시각으로 분석하는 객관적 탐구 역량이 뛰어난 학생임. <span class='highlight'>비정규직 고용의 양산을 주제로 노동자의 적정 처우와 기업의 경영 유연성 사이의 관계를 탐구함. 마스크 수요 변동 사례를 통해 고용 형태에 따른 부작용을 실증적으로 분석하고, 노사 간 요구사항을 절충하여 임금과 근로 조건을 합의하는 것이 기업과 노동자의 상생을 위한 합리적 균형점임을 제시함</span>. 이어 한국형 블랙 기업의 실태를 다룬 보고서에서는 미정산 사태가 난 국내 전자상거래 플랫폼과 불공정 거래가 있었던 국내 유제품 제조 기업 사례를 통해 노동 착취와 갑질 문제를 여러모로 고찰함. <span class='highlight'>기업의 부당 행위 근절을 위해 손해배상제 강화와 함께 정보공시 의무화를 주장하며, 기업의 성장이 반드시 노동자의 인권 보장 위에서 이루어져야 한다는 확고한 가치관을 드러냄</span>. <span class='highlight'>사회 문제의 원인을 구조적으로 파악하고 법적, 제도적 보완이라는 구체적인 해결책을 도출하는 모습에서 경제와 사회 현상을 연결하는 통합적 사고력이 돋보임</span>. 스스로 성장하며 사회적 약자의 처우 개선과 건전한 경제 생태계를 고민하는 진지한 모습은 장차 우리 사회를 밝힐 훌륭한 인재로 성장할 가능성을 보여줌.",
                tags: ["노동인권보장", "기업윤리실증분석", "통합적문제해결"]
            },
            {
                grade: "3학년",
                type: "체육·예술",
                subject: "운동과 건강",
                text: "운동 수행 과정에서 여러 동작을 유기적으로 연결하고 집중력을 유지하는 능력이 돋보임. <span class='highlight'>제자리멀리뛰기에서는 팔의 반동, 무릎의 굽힘과 폄, 발의 지면 밀기, 착지까지 각 분절이 적절한 타이밍에 협응되어야 효율적인 도약이 이루어진다는 점을 이해하고, 반복적인 연습을 통해 동작 간 연결을 자연스럽게 완성함</span>. 수행 결과를 바탕으로 동작의 순서와 타이밍을 스스로 점검하며 완성도를 높이는 모습을 보임. 밸런스보드 활동에서는 주변의 소음이나 다른 사람의 움직임 등 외부 환경에 흔들리지 않고 한 곳에 시선을 고정하며 자신의 균형 유지에 집중하는 태도를 꾸준히 실천함. 외부 요인에 영향을 최소화하고 목표에 집중하는 과정에서 침착함과 자기 통제력을 함께 기름. <span class='highlight'>이러한 경험을 통해 여러 요소를 종합적으로 판단하고 불필요한 변수에 흔들리지 않는 합리적인 사고를 기를 수 있었으며, 이는 다양한 정보를 분석하여 객관적으로 의사결정을 내리는 경제학 분야의 역량과 자연스럽게 연결되는 모습이 돋보임</span>.",
                tags: ["신체분절협응", "자기통제력", "합리적의사결정연계"]
            }
        ];

        const tbody = document.getElementById('table-body');
        let currentGrade = "";
        
        rawData.forEach((item, index) => {
            if(item.grade !== currentGrade) {
                tbody.innerHTML += `
                    <tr id="grade-${item.grade}" class="block md:table-row bg-blue-50 border-t-2 border-b border-blue-200 mt-4 md:mt-0">
                        <td colspan="3" class="block md:table-cell text-center font-bold text-base md:text-lg py-2.5 md:py-3 text-blue-800">${item.grade} 원문 기록</td>
                    </tr>`;
                currentGrade = item.grade;
            }
            
            let tagsHtml = item.tags.map(t => `<span class="inline-block bg-white text-gray-700 border border-gray-300 shadow-sm text-[10px] md:text-xs px-1.5 md:px-2.5 py-0.5 md:py-1 rounded font-semibold mr-1 mt-1.5 md:mt-2">${t}</span>`).join('');
            
            tbody.innerHTML += `
            <tr class="block md:table-row border-b md:border-b border-gray-200 bg-white hover:bg-gray-50 transition duration-150 mb-2 md:mb-0 shadow-sm md:shadow-none rounded-lg md:rounded-none overflow-hidden mx-1 md:mx-0">
                <td class="block md:table-cell px-3 md:px-5 py-2 md:py-4 align-top border-b md:border-b-0 md:border-r border-gray-100 md:border-gray-200 text-left md:text-center font-bold text-gray-700 text-sm md:text-base bg-gray-50 md:bg-transparent flex justify-between items-center md:table-cell">
                    <span class="md:hidden text-gray-500 font-normal text-xs">학년</span>
                    ${item.grade}
                </td>
                <td class="block md:table-cell px-3 md:px-5 py-2 md:py-4 align-top border-b md:border-b-0 md:border-r border-gray-100 md:border-gray-200">
                    <div class="flex md:block items-center gap-2">
                        <span class="md:hidden text-gray-500 font-normal text-xs">영역/과목:</span>
                        <div class="font-bold text-blue-700 text-[13px] md:text-[15px] mb-0 md:mb-1">${item.type}</div>
                        <div class="text-[11px] md:text-sm font-semibold text-gray-600 bg-gray-100 px-1.5 md:px-2 py-0.5 md:py-1 rounded inline-block">${item.subject}</div>
                    </div>
                </td>
                <td class="block md:table-cell px-3 md:px-5 py-3 md:py-4 text-gray-800 leading-relaxed text-[13.5px] md:text-[15px] align-top break-keep">
                    ${item.text}
                    <div class="mt-2 md:mt-4 block border-t border-gray-100 pt-2 md:pt-3">
                        <span class="text-[10px] md:text-xs font-bold text-blue-500 block mb-1">AI 추출 핵심 역량 및 키워드</span>
                        ${tagsHtml}
                    </div>
                </td>
            </tr>`;
        });

        function scrollToGrade(grade) {
            const element = document.getElementById('grade-' + grade);
            if (element) {
                const headerOffset = document.querySelector('header').offsetHeight;
                const elementPosition = element.getBoundingClientRect().top;
                const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
        
                window.scrollTo({
                    top: offsetPosition,
                    behavior: "smooth"
                });
            }
        }
    </script>
</body>
</html>
